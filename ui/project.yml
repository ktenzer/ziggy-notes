name: ZiggyNotes
options:
  bundleIdPrefix: com.temporal
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

packages:
  swift-temporal-sdk:
    url: https://github.com/apple/swift-temporal-sdk
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Dev tool: no sandbox (it spawns the Python worker) and no hardened runtime
    # so running from Xcode just works. Microphone is governed by TCC + the
    # usage description below.
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  ZiggyNotes:
    type: application
    platform: macOS
    sources:
      - path: ZiggyNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temporal.ziggynotes
        PRODUCT_NAME: "Ziggy Notes"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ZiggyNotes/ZiggyNotes.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ziggy Notes records meeting audio (mic + system output) to transcribe and summarize your calls."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Ziggy Notes"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_LSUIElement: "NO"
    dependencies:
      - package: swift-temporal-sdk
        product: Temporal
