name: ZiggyNotes
options:
  bundleIdPrefix: com.temporal
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

packages:
  swift-temporal-sdk:
    url: https://github.com/apple/swift-temporal-sdk
    branch: main
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Dev tool: no sandbox (it spawns the Python worker) and no hardened runtime
    # so running from Xcode just works. Microphone is governed by TCC + the
    # usage description below.
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  ZiggyNotes:
    type: application
    platform: macOS
    sources:
      - path: ZiggyNotes
        excludes:
          # Committed template only — the real (gitignored) ZiggyDefaults.plist
          # is what ships, seeding Settings on a fresh install.
          - "ZiggyDefaults.example.plist"
      # The in-process Swift worker compiles into the app target so it can reuse
      # the app's DTOs and run hands-off capture.
      - path: ../worker
        excludes:
          - "Resources/**"
      # Bundled worker resources: role guidance markdown (ae/sa/bdr) and, when
      # present, the offline WhisperKit model folder (whisper-models/). Files are
      # copied into the app's Resources root.
      - path: ../worker/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.temporal.ziggynotes
        PRODUCT_NAME: "Ziggy Listens"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ZiggyNotes/ZiggyNotes.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ziggy Listens records meeting audio (mic + system output) to transcribe and summarize your calls."
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Ziggy Listens captures your meeting's system audio (the people you're talking to) so it can transcribe and summarize the call."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Ziggy Listens"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_LSUIElement: "NO"
    dependencies:
      - package: swift-temporal-sdk
        product: Temporal
      - package: WhisperKit
        product: WhisperKit
