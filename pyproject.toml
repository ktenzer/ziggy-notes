[project]
name = "ziggy-notes"
version = "0.1.0"
description = "Ziggy Notes -- a Temporal-based active-listening meeting note-taker for Temporal sales calls. Records macOS audio (mic + system output), transcribes locally with faster-whisper, streams live active-listening suggestions via Temporal Workflow Streams, and produces a concise summary + next steps as a Google Doc."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio>=1.34.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.5.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
